# =============================================================================
# FILE: policy.yaml (Divecha Router v2 — policy version 3)
# =============================================================================
# WHAT THIS FILE IS:
# Routing profiles for the Arjun Model Gateway. In v2 a profile declares
# CONSTRAINTS and an OBJECTIVE — never a model id. The selector resolves each
# profile against the live OpenRouter catalog at request time, so newly
# released models become candidates automatically. Quality floors are slices
# of the live intelligence ranking (basic=any, medium=top 60%, high=top 25%,
# frontier=top 8 models). Objectives: cheapest_success (min expected cost per
# verified success), fastest (OpenRouter latency ranking + provider latency
# sort), smartest (intelligence ranking, price-capped).
#
# NOTHING in this file may name a model — the PolicyProfile schema forbids a
# `model:` key outright (extra=forbid). Marketplace routes select from the
# live OpenRouter catalog; local/direct routes resolve from the provider's
# own live models API at decision time.
#
# INPUT/OUTPUT: read by config.load_policy() from
# /Users/arjundivecha/Dropbox/AAA Backup/A Working/Divecha Router/config/policy.yaml;
# this file produces no outputs itself.
# =============================================================================

version: 3
default_profile: auto

profiles:
  # bulk work: summaries, extraction, log scanning
  cheap:
    route_type: simple
    objective: cheapest_success
    quality_floor: basic
    select:
      min_context: 32000
      max_prompt_price_per_million: 1.0
      pool_size: 8
      max_fallbacks: 2
    expected_tokens: {input: 2000, output: 500}
    default_budget_usd: 0.02
    reasoning: "off"   # bulk work: no hidden thinking eating small token budgets

  # interactive latency-sensitive calls
  fast:
    route_type: simple
    objective: fastest
    quality_floor: medium
    select:
      min_context: 32000
      max_prompt_price_per_million: 3.0
      pool_size: 8
    expected_tokens: {input: 4000, output: 800}
    default_budget_usd: 0.10
    reasoning: "off"   # bulk work: no hidden thinking eating small token budgets

  # coding: strong outer model + frontier advisor second opinion
  code:
    route_type: advisor
    objective: cheapest_success
    quality_floor: high
    select:
      require_parameters: [tools]
      min_context: 128000
      max_prompt_price_per_million: 5.0
      pool_size: 8
    expected_tokens: {input: 16000, output: 3000}
    default_budget_usd: 0.75
    advisor_instructions: >-
      You are a senior staff engineer. Focus on correctness, tests, and
      minimal diffs.

  # CHEAP coding: a smart boss orchestrates a DeepSeek worker via OpenRouter's
  # subagent server tool. `smartest` resolves the boss to Claude Opus 5 today
  # (catalog intelligence rank 0); it tracks the frontier, so the boss follows
  # whatever tops the ranking. The worker is a DeepSeek tier, auto-selected per
  # request: LIGHT = cheapest DeepSeek for routine subtasks; HEAVY = the
  # SMARTEST DeepSeek (by live intelligence rank) when the request raises
  # quality_floor, is large, or brings tools (see policy.infer_worker_heavy).
  # Both tiers are objective — author preference + cheapest/smartest, NO pinned
  # ids and no brittle name match. NOTE (2026-08-05 catalog): DeepSeek V4 Flash
  # currently out-ranks V4 Pro, so HEAVY resolves to Flash today too; the
  # instant an updated Pro ranks higher, HEAVY picks it up automatically.
  cheap_code:
    route_type: subagent
    objective: smartest
    quality_floor: high
    select:
      require_parameters: [tools]
      min_context: 128000
      max_prompt_price_per_million: 10.0
      pool_size: 8
    expected_tokens: {input: 16000, output: 3000}
    default_budget_usd: 0.50
    worker_tiers:
      light: {prefer_authors: [deepseek], pick: cheapest}
      heavy: {prefer_authors: [deepseek], pick: smartest}
    subagent_instructions: >-
      You are a focused coding worker. Implement exactly what the task
      describes, keep diffs minimal, and preserve any requested output format,
      citations, and schema exactly.

  # multi-model research synthesis (fusion panel from distinct authors).
  # objective is fastest ON PURPOSE: the outer model only orchestrates the
  # server-side fusion tool — quality comes from the panel + judge. Measured
  # 2026-07-10: slow-reasoning outers (grok-4.5, gpt-5.6-sol) made the route
  # take 9-15 minutes; low-latency outers finish the same panel in ~1.5-3 min.
  research:
    route_type: fusion
    objective: fastest
    quality_floor: high
    select:
      min_context: 128000
      max_prompt_price_per_million: 8.0
      pool_size: 8
    expected_tokens: {input: 24000, output: 4000}
    default_budget_usd: 2.50
    fusion: {panel_size: 4, max_tool_calls: 1}

  # finance/quant work (no sensitivity handling — Arjun: there is no sensitive
  # data). fastest outer for the same reason as research.
  finance:
    route_type: fusion
    objective: fastest
    quality_floor: high
    select:
      min_context: 128000
      max_prompt_price_per_million: 10.0
      pool_size: 8
    expected_tokens: {input: 24000, output: 4000}
    default_budget_usd: 3.00
    fusion: {panel_size: 4, max_tool_calls: 1}

  # guaranteed-schema JSON output (schema is injected AND validated)
  structured:
    route_type: simple
    objective: cheapest_success
    quality_floor: medium
    select:
      require_parameters: [structured_outputs]
      min_context: 32000
      max_prompt_price_per_million: 2.0
      pool_size: 8
    expected_tokens: {input: 8000, output: 1500}
    default_budget_usd: 0.10
    reasoning: "off"   # bulk work: no hidden thinking eating small token budgets

  # very large inputs, delegated to a cheap subagent worker
  long_context:
    route_type: subagent
    objective: cheapest_success
    quality_floor: medium
    select:
      min_context: 500000
      max_prompt_price_per_million: 8.0
      pool_size: 6
    expected_tokens: {input: 160000, output: 8000}
    default_budget_usd: 3.00

  # the single smartest model available right now, whatever it is
  frontier:
    route_type: simple
    objective: smartest
    quality_floor: frontier
    select:
      pool_size: 4
    expected_tokens: {input: 8000, output: 2000}

  # high-scrutiny answers; external verification expected via /v1/outcomes
  verify:
    route_type: advisor
    objective: smartest
    quality_floor: high
    select:
      require_parameters: [tools]
      min_context: 128000
      max_prompt_price_per_million: 8.0
      pool_size: 8
    expected_tokens: {input: 12000, output: 2000}
    require_verification: true
    advisor_instructions: >-
      Check the answer against deterministic gates. Do not certify success
      without external evidence.

  # local-only escape hatch — model resolved live from the local server's
  # /v1/models (Ollama or any OpenAI-compatible server)
  private:
    route_type: local
    provider: local_openai
    external_calls_allowed: false

  # direct-provider adapter diagnostics — models resolved live from each
  # provider's own models API (newest small tier); nothing is pinned
  direct_openai_smoke:
    route_type: direct
    provider: openai
    quality_floor: medium

  direct_anthropic_smoke:
    route_type: direct
    provider: anthropic
    quality_floor: medium

  # Celeris-1 (diffusion LM) via its own OpenAI-compatible endpoint. DIRECT
  # route: the model resolves live from Celeris's /models (currently the single
  # celeris-1), never pinned. Purpose: latency-sensitive short work
  # (classification, extraction, query rewrite). Direct routes bypass the
  # marketplace selector, so this is an explicit pin — call it by profile name.
  # Pricing (2026-08): $0.20/M input, $0.70/M output. US-only API.
  fast_celeris:
    route_type: direct
    provider: celeris
