version: 1
minimum_robustness: 0.95

# Each case holds the task constant while changing only its surface form.
# The five perturbation families follow arXiv:2607.09197.
cases:
  - id: finance-risk
    expected_profile: finance
    prompt: Analyze the risks in this investment portfolio.
    variants:
      - kind: character
        prompt: Analyz the risks in this investment portfoliio.
      - kind: word
        prompt: Assess the downside exposure in these holdings.
      - kind: syntax
        prompt: For these asset positions, which risks should be assessed?
      - kind: paraphrase
        prompt: Where could this collection of securities lose money?
      - kind: rambling
        prompt: I have been thinking about several scenarios; review the asset allocation and drawdown risks.

  - id: coding-repair
    expected_profile: code
    prompt: Debug this repository change and run its tests.
    variants:
      - kind: character
        prompt: Debg this repositry change and run the tests.
      - kind: word
        prompt: Find the bug in this software patch and verify the fix.
      - kind: syntax
        prompt: This implementation fails; identify the cause and correct it.
      - kind: paraphrase
        prompt: Work out why the program change breaks and produce a tested repair.
      - kind: rambling
        prompt: I tried several approaches and still see the same stack trace; inspect the patch, correct it, and test the result.

  - id: sourced-research
    expected_profile: research
    prompt: Compare the evidence from several sources and synthesize a conclusion.
    variants:
      - kind: character
        prompt: Compare the evidnce from several sources and synthesize a conclusion.
      - kind: word
        prompt: Review the literature and reconcile the findings.
      - kind: syntax
        prompt: From the cited sources, what conclusion is best supported?
      - kind: paraphrase
        prompt: Investigate the competing claims and produce an evidence-based answer.
      - kind: rambling
        prompt: There are many opinions here and I do not want a snap answer; examine the citations and reconcile the disagreement.

  - id: legal-review
    expected_profile: research
    prompt: Review the legal arguments and identify the controlling law.
    variants:
      - kind: character
        prompt: Review the legl arguments and identify the controlling law.
      - kind: word
        prompt: Assess the regulatory arguments and governing authority.
      - kind: syntax
        prompt: Which law controls these competing arguments?
      - kind: paraphrase
        prompt: Evaluate the case under the applicable legal rules.
      - kind: rambling
        prompt: The parties tell very different stories; apply the governing legal authority and explain which argument prevails.

  - id: structured-extraction
    expected_profile: structured
    prompt: Extract the requested fields.
    metadata:
      structured_output_schema:
        type: object
        properties:
          name: {type: string}
        required: [name]
    variants:
      - kind: character
        prompt: Extrct the requested fields.
      - kind: word
        prompt: Return the specified values.
      - kind: syntax
        prompt: The requested fields should be extracted.
      - kind: paraphrase
        prompt: Pull out only the required information.
      - kind: rambling
        prompt: There is plenty of surrounding prose, but the result should contain only the requested fields.

  - id: simple-cleanup
    expected_profile: cheap
    prompt: Make this sentence shorter.
    variants:
      - kind: character
        prompt: Make this sentnce shorter.
      - kind: word
        prompt: Shorten this sentence.
      - kind: syntax
        prompt: This sentence should be made shorter.
      - kind: paraphrase
        prompt: Condense the wording.
      - kind: rambling
        prompt: The wording feels longer than it needs to be, so trim it while preserving the meaning.

  - id: long-context-summary
    expected_profile: long_context
    prompt: Summarize the attached document.
    metadata:
      context_length_estimate: 150000
    variants:
      - kind: character
        prompt: Summairze the attachd document.
      - kind: word
        prompt: Provide a summary of the attached document.
      - kind: syntax
        prompt: The attached document should be summarized.
      - kind: paraphrase
        prompt: Give a condensed overview of what's in the attached document.
      - kind: rambling
        prompt: There's a lot going on in this attached document and I don't have time to read all of it myself, so please summarize it for me.

  - id: fast-weekend-planning
    expected_profile: fast
    prompt: I'm trying to plan a relaxed weekend for my family and could use some help thinking it through out loud, since everyone has a different idea about timing. We want to visit the botanical garden in the morning, swing by the farmers market for fresh produce, and then head to the lake in the afternoon before the kids get too tired and cranky. Could you help me figure out roughly how much time to spend at each stop, what snacks and drinks we should pack for the car, where a good spot for a casual lunch might be along the way, and what a sensible backup plan looks like if the weather turns and it starts raining before we even get to the lake.
    variants:
      - kind: character
        prompt: Im tryng to plan a relaxd weeknd for my familly and could use some help thinkng it throughh out loud, since everyone has a differnt idea about timng. We want to visit the botanicl garden in the mornng, swing by the farmers markt for fresh produce, and then head to the lak in the afternoon before the kids get too tired and cranky. Could you help me figur out roughly how much time to spend at each stop, what snacks and drinks we should pack for the car, where a good spot for a casual lunch might be along the way, and what a sensible backup plan looks like if the weather turns and it starts raining before we even get to the lake.
      - kind: word
        prompt: I am trying to organize a laid-back weekend for my household and would appreciate some help talking it through. We would like to tour the botanical garden in the morning, stop by the farmers market for fresh produce, then travel to the lake in the afternoon before the children get worn out and cranky. Could you help me work out roughly how long to spend at each stop, what snacks and drinks we should bring along for the drive, where a nice spot for a relaxed lunch might be on the way, and what a sensible fallback plan looks like if the weather changes and it starts raining before we even arrive at the lake.
      - kind: syntax
        prompt: For my family's relaxed weekend, help is what I could use thinking it through out loud, since everyone has a different idea about timing. In the morning the botanical garden is where we want to go, the farmers market is where we'll stop for fresh produce, and in the afternoon the lake is where we'll head before the kids get too tired and cranky. Roughly how much time to spend at each stop, what snacks and drinks we should pack for the car, where a good spot for a casual lunch might be along the way, and what a sensible backup plan looks like if it starts raining before we even get to the lake, could you help me figure out?
      - kind: paraphrase
        prompt: I want to sketch out an easygoing Saturday and Sunday for my family and would love a thinking partner, since everyone in the house has a slightly different idea about timing and nobody wants to be the one who ruins it by overplanning. The plan is a morning stroll through the botanical garden, an afternoon stop at the farmers market for fresh produce, then some lake time before the kids wear out and get cranky. Could you help me estimate how long each stop deserves, what snacks and drinks belong in the car, a nice casual spot for lunch along the route, and a sensible fallback for when the sky clouds over and rain starts before we even reach the lake.
      - kind: rambling
        prompt: So here's the thing, I keep going back and forth on this and I don't want to overthink it but also don't want us all standing around bored, so let me just talk through the weekend out loud with you. We're thinking morning at the botanical garden, then the farmers market for fresh produce, then the lake in the afternoon, but the kids get tired and cranky fast so timing matters a lot here, and honestly I have no idea how long each stop should really take, what snacks and drinks make sense to toss in the car, where along the way we might grab a casual lunch, and what we'd even do instead if the clouds roll in and it starts raining before we make it to the lake at all.
