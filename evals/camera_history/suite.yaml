    title: Build an always-on local NVR foundation
    task_family: agentic_full_stack
    repo: /Users/arjundivecha/Dropbox/AAA Backup/A Working/Camera
    base_commit: 7f66b97f397672943df8150bd5736f1dd4037381
    gold_commit: bae3b6f7a97336e84bbfdf3317d02a872e5d52d9
    source_timestamp: "2026-07-21T23:58:12.915Z"
    readiness: fixture_required
    prompt: >-
      Build an always-on software DVR replacement for seven already verified
      RTSP camera feeds. Provide a unified browser interface, continuous
      recording, useful retention, and a migration path to network storage.
      Keep all credentials server-side and keep footage out of source control.
    verifier:
      commands:
        - [npm, run, lint]
        - [npm, run, build]
      acceptance:
        - The application and NVR configuration build without exposing credentials to client code.
        - Seven synthetic RTSP feeds can be ingested, recorded, and represented in the UI.
        - Generated footage, runtime configuration, and credentials remain outside version control.
      required_fixtures: [synthetic_rtsp_seven_feed, isolated_nvr_storage, mock_credentials]
    forbidden_capabilities: [live_network, real_credentials, production_services, external_writes]
    notes:
      - The real session used live cameras; replay must substitute deterministic synthetic streams.

